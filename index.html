<body>
<div class="wrap">
  <div class="barra" id="barra">
    <header class="top">
      <a class="brand" href="#trilha"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M12 10l-5 6 5 6M20 10l5 6-5 6" fill="none" stroke="var(--sun)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Trilha Livre</span></a>
      <div class="stats" id="stats"></div>
    </header>
    <nav class="tabs" aria-label="Seções">
      <a href="#cursos" data-tab="cursos">Cursos</a>
      <a href="#trilha" data-tab="trilha">Trilha</a>
      <a href="#pratica" data-tab="pratica">Prática</a>
      <a href="#livros" data-tab="livros">Livros</a>
      <a href="#perfil" data-tab="perfil">Perfil</a>
    </nav>
  </div>
  <main>
    <section id="tela-cursos" hidden></section>
    <section id="tela-trilha"></section>
    <section id="tela-pratica" hidden></section>
    <section id="tela-livros" hidden></section>
    <section id="tela-perfil" hidden></section>
    <section id="lesson" hidden>
      <div class="lbar">
        <button class="xbtn" id="closeBtn" aria-label="Sair da lição">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="prog" id="progBar" role="progressbar" aria-label="Progresso da lição" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1"><i id="progFill"></i></div>
        <button class="xbtn" id="termBtnL" aria-label="Abrir terminal" title="Terminal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></svg>
        </button>
      </div>
      <div class="ex" id="exArea"></div>
    </section>
    <section id="fim" hidden></section>
  </main>
</div>

<div class="actions" id="actions" hidden>
  <div class="wrap">
    <div class="fb" id="fb" hidden></div>
    <button class="btn-main" id="mainBtn" disabled>Verificar</button>
  </div>
</div>

<div class="term" id="term" hidden role="dialog" aria-label="Terminal">
  <div class="term-head">
    <div class="term-title">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></svg>
      Terminal <small id="termLang">JavaScript</small>
    </div>
    <div class="term-btns">
      <button id="tClear">Limpar</button>
      <button id="tReset">Reiniciar</button>
      <button id="tClose" aria-label="Fechar terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="term-log" id="tLog" aria-live="polite"></div>
  <div class="term-in">
    <span class="pr" aria-hidden="true">›</span>
    <textarea id="tInput" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Comando" placeholder="Digite um comando"></textarea>
    <button id="tRun" aria-label="Executar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="sr" id="anuncio" aria-live="assertive" aria-atomic="true"></div>
<noscript><p style="padding:16px">O Trilha Livre precisa de JavaScript ligado para funcionar.</p></noscript>
